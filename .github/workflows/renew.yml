name: Auto Renew HidenCloud 

on:
  workflow_dispatch:
  schedule:
    - cron: '30 05 * * 1' # 根据到期时间在星期几 提前一天,比如星期三到期，cron写星期二即可

permissions:
  actions: write
  contents: write # 由 read 改为 write：用于把运行时间记录提交回 README.md

jobs:
  Renew-HidenCloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright requests 'requests[socks]'
          python -m playwright install --with-deps chrome
          
      - name: ⚙ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 📝 更新最近运行时间到 README.md
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          # 当前运行时间（北京时间）
          RUN_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          if [ "$RUN_STATUS" = "success" ]; then
            ENTRY="- 🕒 ${RUN_TIME}（北京时间）✅ 续期成功"
          else
            ENTRY="- 🕒 ${RUN_TIME}（北京时间）❌ 运行${RUN_STATUS}"
          fi

          if [ ! -f README.md ]; then
            # README.md 不存在：自动创建并写入最近运行时间区块
            {
              echo "# Auto Renew HidenCloud"
              echo ""
              echo "## 🕒 最近运行时间"
              echo ""
              echo "<!-- RUN_LOG_START -->"
              echo "${ENTRY}"
              echo "<!-- RUN_LOG_END -->"
            } > README.md
          elif grep -q '<!-- RUN_LOG_START -->' README.md; then
            # 已有标记：把上一次的时间替换为本次（只保留最新一条）
            awk -v entry="${ENTRY}" '
              /<!-- RUN_LOG_END -->/ {inblock=0}
              !inblock {print}
              /<!-- RUN_LOG_START -->/ {inblock=1; print entry}
            ' README.md > README.tmp && mv README.tmp README.md
          else
            # 无标记：在文件末尾追加最近运行时间区块（不影响已有内容）
            {
              echo ""
              echo "## 🕒 最近运行时间"
              echo ""
              echo "<!-- RUN_LOG_START -->"
              echo "${ENTRY}"
              echo "<!-- RUN_LOG_END -->"
            } >> README.md
          fi

          # 提交并推送（GITHUB_TOKEN 的 push 不会触发其他 workflow，无循环风险）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README.md 无变化，跳过提交"
          else
            git commit -m "chore: 更新最近运行时间 ${RUN_TIME} [skip ci]"
            git push
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
